---
# Debian/Ubuntu specifics.

# The account the dotfiles are installed for. Tasks that write into a home
# directory run as this user via become_user, so on a remote host this is who
# ends up with the config.
user: pete
user_home: "/home/{{ user }}"

# Where pinned release binaries (terraform, terragrunt, ...) are dropped.
local_bin: /usr/local/bin

# go is unpacked from the upstream tarball rather than installed by apt
go_bin: /usr/local/go/bin/go

llvm_version: llvmorg-16.0.3
llvm_build_dir_path: /usr/local/src/llvm
llvm_install_dir_path: /usr/local

base_packages:
  - apt-utils
  - git
  - make
  - curl
  - apt-transport-https
  - ca-certificates
  - gnupg
  - lsb-release
  - jq
  - libtool
  - cmake
  - unzip
  - bat
  - htop
  - gcalcli
  - fzf
  - fonts-powerline
  - fonts-anonymous-pro
  - powerline
  - xclip
  - lua5.4
  - hugo
  - regina-rexx
  - okteta
  - x3270
  - libtool-bin
  - pkg-config
  - gettext
  - tree
  - ripgrep
  - openssh-server
  - xsel
  - graphviz
  - meson
  - rsync

bash_packages:
  - bash
  - shellcheck
  - yamllint

debug_packages:
  - build-essential
  - bpfcc-tools
  - bpftrace
  - strace
  - gdb
  - dwarfdump
  - gcc-multilib
  - g++-multilib
  - libc6-dev-i386
  - nasm
  - valgrind
  - massif-visualizer
  - libelf-dev
  - linux-tools-generic
  - linux-cloud-tools-generic

net_packages:
  - net-tools
  - curl
  - nmap
  - nmon
  - nikto
  - dnsutils

python_packages:
  - python3
  - python3-setuptools
  - python3-dev
  - python3-pip
  - python3-venv

python_tools:
  - black
  - radon
  - bandit
  - pylint
  - doq
  - pytest

python_libs:
  - ipdb
  - neovim
