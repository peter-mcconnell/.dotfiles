---
- name: Install dotfiles and dependencies
  hosts: "{{ hosts | default('remote') }}"
  become: true
  # Facts are gathered explicitly below so they describe the login user rather
  # than root - vars/<os_family>.yaml leans on ansible_user_id/ansible_user_dir.
  gather_facts: false
  vars_files:
    - vars.yaml
  pre_tasks:
    - name: gather facts as the login user
      become: false
      ansible.builtin.setup:

    - name: check the platform is supported
      ansible.builtin.assert:
        that: ansible_os_family in ['Debian', 'Darwin']
        fail_msg: >-
          unsupported os_family '{{ ansible_os_family }}' -
          only Debian and Darwin have task sets

    - name: load {{ ansible_os_family }} variables
      ansible.builtin.include_vars: "vars/{{ ansible_os_family }}.yaml"

  tasks:
    - name: run the {{ ansible_os_family }} task set
      ansible.builtin.include_tasks: "tasks/{{ ansible_os_family }}/main.yaml"
